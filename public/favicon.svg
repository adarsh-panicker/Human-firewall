<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Shield Outline -->
  <path d="M50 8 L85 22 V50 C85 70 50 92 50 92 C50 92 15 70 15 50 V22 Z" fill="#0B132B" stroke="#06B6D4" stroke-width="4" stroke-linejoin="round"/>
  <!-- Inner Shield Glow -->
  <path d="M50 14 L80 26 V48 C80 65 50 85 50 85 C50 85 20 65 20 48 V26 Z" fill="url(#shieldGrad)" opacity="0.3"/>
  <!-- Lightning Bolt -->
  <polygon points="54,20 36,52 48,52 44,78 64,44 52,44" fill="url(#boltGrad)" filter="url(#glow)"/>
</svg>
